<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión — TestTrack QA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/auth/auth.css}">
</head>
<body>
<main class="auth-shell">
    <a class="brand" th:href="@{/login}">
        <img class="brand-logo" th:src="@{/images/logo/Logo.png}" alt="TestTrack">
    </a>

    <section class="auth-card" aria-labelledby="page-title">
        <header class="auth-heading">
            <p class="eyebrow">TestTrack QA</p>
            <h1 id="page-title">Bienvenido de nuevo</h1>
            <p>Inicia sesión para continuar con tus proyectos.</p>
        </header>

        <p class="notice notice-success" th:if="${param.registrado}" role="status">
            Tu cuenta fue creada. Ya puedes iniciar sesión.
        </p>
        <p class="notice notice-error" th:if="${param.error}" role="alert">
            No se pudo iniciar sesión. Revisa tu correo y contraseña.
        </p>
        <p class="notice notice-success" th:if="${param.logout}" role="status">
            Cerraste sesión correctamente.
        </p>

        <form th:action="@{/login}" method="post">
            <div class="field">
                <label for="correo">Correo electrónico</label>
                <input id="correo" name="correo" type="email" autocomplete="username"
                       placeholder="nombre@ejemplo.com" required autofocus>
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" autocomplete="current-password"
                       placeholder="Tu contraseña" required>
            </div>
            <button class="btn-primary" type="submit">Iniciar sesión</button>
        </form>

        <p class="auth-footer">¿Aún no tienes cuenta? <a th:href="@{/registro}">Crear cuenta</a></p>
    </section>
</main>
</body>
</html>
