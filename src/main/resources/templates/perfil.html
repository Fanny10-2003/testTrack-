<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TestTrack QA — Mi perfil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/proyecto/proyecto.css}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/proyectos}">
        <img class="brand-logo" th:src="@{/images/logo/Logo.png}" alt="TestTrack">
    </a>
    <nav aria-label="Navegación principal">
        <a class="nav-link" th:href="@{/proyectos}">Proyectos</a>
        <a class="nav-link" th:href="@{/incidencias}">Incidencias</a>
        <span class="nav-link" aria-disabled="true">Invitaciones</span>
        <a class="nav-link" th:href="@{/perfil}" aria-current="page">Mi perfil</a>
    </nav>
    <a class="profile" th:href="@{/perfil}" th:text="${iniciales}"
       th:attr="aria-label=${'Ver perfil de ' + usuarioNombre}" title="Mi perfil">TT</a>
</header>

<main class="form-page">
    <section class="page-head">
        <div>
            <p class="eyebrow">Cuenta</p>
            <h1>Mi perfil</h1>
            <p class="subtitle">Actualiza tus datos personales y la contraseña de tu cuenta.</p>
        </div>
    </section>

    <p class="notice notice-success" th:if="${mensaje}" th:text="${mensaje}" role="status"></p>

    <form class="project-form profile-form" th:action="@{/perfil}" th:object="${perfil}" method="post">
        <div class="profile-section">
            <h2>Datos personales</h2>
            <div class="field">
                <label for="nombre">Nombre</label>
                <input id="nombre" type="text" th:field="*{nombre}" autocomplete="name" required>
                <span class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
            </div>
            <div class="field">
                <label for="correo">Correo electrónico</label>
                <input id="correo" type="email" th:field="*{correo}" autocomplete="email" required>
                <span class="field-error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></span>
            </div>
        </div>

        <div class="profile-section">
            <h2>Cambiar contraseña</h2>
            <p class="profile-help">Deja estos campos vacíos si no quieres cambiarla.</p>
            <div class="field">
                <label for="contrasenaActual">Contraseña actual</label>
                <input id="contrasenaActual" type="password" th:field="*{contrasenaActual}"
                       autocomplete="current-password">
                <span class="field-error" th:if="${#fields.hasErrors('contrasenaActual')}"
                      th:errors="*{contrasenaActual}"></span>
            </div>
            <div class="field">
                <label for="nuevaContrasena">Contraseña nueva</label>
                <input id="nuevaContrasena" type="password" th:field="*{nuevaContrasena}"
                       autocomplete="new-password" minlength="8" maxlength="72">
                <span class="field-error" th:if="${#fields.hasErrors('nuevaContrasena')}"
                      th:errors="*{nuevaContrasena}"></span>
            </div>
            <div class="field">
                <label for="confirmarContrasena">Confirmar contraseña nueva</label>
                <input id="confirmarContrasena" type="password" th:field="*{confirmarContrasena}"
                       autocomplete="new-password">
                <span class="field-error" th:if="${#fields.hasErrors('confirmarContrasena')}"
                      th:errors="*{confirmarContrasena}"></span>
            </div>
        </div>

        <div class="form-actions">
            <a class="btn-ghost" th:href="@{/proyectos}">Cancelar</a>
            <button class="btn-primary" type="submit">Guardar cambios</button>
        </div>
    </form>

    <section class="logout-card">
        <div>
            <h2>Cerrar sesión</h2>
            <p>Finaliza tu sesión en este dispositivo.</p>
        </div>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn-ghost" type="submit">Cerrar sesión</button>
        </form>
    </section>
</main>
</body>
</html>
